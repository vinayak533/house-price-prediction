[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "california-house-price-prediction"
version = "1.0.0"
description = "Production-grade regression pipeline predicting California residential property valuations via HistGradientBoostingRegressor."
authors = ["Vinayak <https://github.com/vinayak533>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.26.0,<3.0.0"
pandas = ">=2.0.0,<3.0.0"
scikit-learn = ">=1.4.0,<2.0.0"
joblib = ">=1.3.0,<2.0.0"
matplotlib = { version = ">=3.7.0,<4.0.0", optional = true }
seaborn = { version = ">=0.12.0,<1.0.0", optional = true }

[tool.poetry.extras]
viz = ["matplotlib", "seaborn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0,<10.0.0"
black = ">=24.0.0"
flake8 = ">=7.0.0"

[tool.poetry.scripts]
train = "src.train:main"
predict = "src.predict:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
